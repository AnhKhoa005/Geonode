{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layers - GeoNode WebGIS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1e3a5f; --navy-deep: #12294d; --blue: #2563eb; --blue-dark: #1d4ed8;
    --ink: #10233f; --slate: #54677e; --muted: #8ea0b5; --bg: #f3f6fb; --line: #e3e9f2;
  }
  body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  .brand { font-family: 'Be Vietnam Pro', 'Inter', sans-serif; font-weight: 800; font-size: 1.5rem; color: #fff !important; letter-spacing: -0.01em; }
  .brand i { color: #60a5fa; }
  .navbar { background: linear-gradient(180deg, #24466e, var(--navy)); box-shadow: 0 2px 14px rgba(16,35,63,.25); }
  .navbar .nav-link { color: rgba(255,255,255,.82); font-weight: 600; margin-left: .5rem; border-radius: .5rem; }
  .navbar .nav-link:hover { color: #fff; background: rgba(255,255,255,.12); }
  .navbar .nav-link.active { color: #fff; background: var(--blue); box-shadow: 0 4px 14px rgba(37,99,235,.45); }
  .hero { background: linear-gradient(115deg, var(--navy-deep) 0%, var(--navy) 45%, #2f5da3 78%, var(--blue) 135%); color: #fff; padding: 3.5rem 0 3rem; position: relative; }
  .hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg,#60a5fa,#2563eb,#60a5fa); }
  .crumb { font-size: .8rem; color: rgba(255,255,255,.65); letter-spacing: .03em; text-transform: uppercase; }
  .crumb a { color: #bbd7ff; text-decoration: none; }
  .crumb a:hover { color: #fff; }
  .hero h1 { font-family: 'Be Vietnam Pro', 'Inter', sans-serif; font-size: 2.3rem; font-weight: 700; letter-spacing: -0.02em; }
  .hero p { color: rgba(255,255,255,.82); }
  .card { border: 1px solid var(--line); border-radius: 1rem; overflow: hidden; box-shadow: 0 2px 10px rgba(16,35,63,.06); transition: transform .18s, box-shadow .18s, border-color .18s; }
  .card:hover { transform: translateY(-5px); box-shadow: 0 18px 36px rgba(30,58,95,.16); border-color: #bcd0ee; }
  .thumb { width: 100%; height: 160px; object-fit: cover; -o-object-fit: cover; }
  .thumb-ph { width: 100%; height: 160px; background: linear-gradient(135deg,#dbeafe,#ecfdf5); display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #93c5fd; }
  .card-title { font-family: 'Be Vietnam Pro', 'Inter', sans-serif; font-weight: 600; color: var(--ink); line-height: 1.42; transition: color .15s; font-size: 1rem; margin-bottom: .15rem; }
  .card:hover .card-title { color: var(--blue); }
  .resname { display: inline-block; font-size: .72rem; font-family: Consolas, Menlo, monospace; background: #eef4ff; color: var(--blue-dark); padding: 3px 8px; border-radius: 6px; }
  .card-text { font-size: .83rem; color: var(--slate); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { font-size: .76rem; color: var(--muted); font-weight: 500; }
  .meta i { color: #7fa5d6; }
  .card-footer { background: #fff; border-top: 1px solid #eef2f7; }
  .btn-open { background: linear-gradient(180deg,#3b82f6,var(--blue)); color: #fff; border: 0; font-weight: 600; box-shadow: 0 3px 10px rgba(37,99,235,.35); }
  .btn-open:hover { background: var(--blue-dark); color: #fff; }
  .form-control:focus, .form-select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  footer.site-footer { background: var(--navy); color: rgba(255,255,255,.6); padding: 1.5rem 0; font-size: .83rem; }
  footer.site-footer b { color: #fff; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand brand" href="/"><i class="fa fa-globe me-2"></i>Geo<b class="text-primary">Node</b></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#gnNav" aria-controls="gnNav" aria-expanded="false" aria-label="Chuyển menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="gnNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/"><i class="fa fa-home"></i></a></li>
        <li class="nav-item"><a class="nav-link active" href="/datasets"><i class="fa fa-database me-1"></i>Layers</a></li>
        <li class="nav-item"><a class="nav-link" href="/maps"><i class="fa fa-map me-1"></i>Bản đồ</a></li>
        <li class="nav-item"><a class="nav-link" href="/documents"><i class="fa fa-file-text-o me-1"></i>Tài liệu</a></li>
      </ul>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="container">
    <div class="crumb"><a href="/">Trang chủ</a> / <span class="text-white fw-semibold">Layers</span></div>
    <h1 class="mb-1">Khám phá Layers</h1>
    <p class="mb-0">Danh sách các lớp dữ liệu không gian trên nền tảng GeoNode.</p>
  </div>
</header>

<main class="container py-4">
  <div class="row g-3 align-items-center">
    <div class="col-lg-6 col-md-5">
      <div class="input-group">
        <span class="input-group-text bg-white"><i class="fa fa-search text-secondary"></i></span>
        <input id="q" type="text" class="form-control" placeholder="Tìm kiếm layer...">
      </div>
    </div>
    <div class="col-6 col-md-3">
      <select id="typeFilter" class="form-select">
        <option value="">Tất cả loại</option>
        <option value="vector">Vector</option>
        <option value="raster">Raster</option>
      </select>
    </div>
    <div class="col-6 col-md-3">
      <select id="sortSel" class="form-select">
        <option value="newest">Mới nhất</option>
        <option value="title">Tên A-Z</option>
        <option value="popular">Phổ biến</option>
      </select>
    </div>
  </div>
  <div class="text-secondary small fw-medium py-2" id="countline"></div>
  <div id="grid" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 pb-5">
    <div class="col-12 text-center py-5 text-secondary"><i class="fa fa-spinner fa-spin fa-2x d-block mb-2"></i>Đang tải dữ liệu...</div>
  </div>
</main>

<footer class="site-footer text-center">© <span id="yr"></span> GeoNode <b>WebGIS</b> - Đồ án Phát triển ứng dụng Web GIS</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  let all = [];
  const qEl = document.getElementById('q');
  const typeEl = document.getElementById('typeFilter');
  const sortEl = document.getElementById('sortSel');
  const grid = document.getElementById('grid');
  const countline = document.getElementById('countline');

  function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

  function render(){
    let list = all.slice();
    const q = qEl.value.trim().toLowerCase();
    if(q){ list = list.filter(l => (l.title||'').toLowerCase().includes(q) || (l.alternate||'').toLowerCase().includes(q)); }
    const t = typeEl.value;
    if(t){ list = list.filter(l => l.type === t); }
    const s = sortEl.value;
    if(s==='title'){ list.sort((a,b)=>(a.title||'').localeCompare(b.title)); }
    else if(s==='popular'){ list.sort((a,b)=>(b.popular_count||0)-(a.popular_count||0)); }
    else { list.sort((a,b)=>(b.last_updated||b.created||'').localeCompare(a.last_updated||a.created||'')); }
    countline.textContent = 'Hiển thị ' + list.length + ' layer';
    if(!list.length){
      grid.innerHTML = '<div class="col-12 text-center py-5 text-secondary"><i class="fa fa-database fa-3x d-block mb-2" style="opacity:.4"></i>Không tìm thấy layer nào</div>';
      return;
    }
    grid.innerHTML = list.map(function(l){
      const isRaster = (l.type==='raster');
      const owner = (l.owner && l.owner.username) ? l.owner.username : 'unknown';
      const detail = '/catalogue/#/dataset/' + (l.pk || l.id || '');
      const visual = l.thumbnail_url ? '<img class="thumb" src="'+esc(l.thumbnail_url)+'" alt="">'
        : '<div class="thumb-ph"><i class="fa fa-'+(isRaster?'image':'map')+'"></i></div>';
      return '<div class="col">'+
        '<div class="card h-100">'+
          '<div class="position-relative">'+visual+
            '<span class="badge position-absolute top-0 start-0 m-2 '+(isRaster?'bg-success':'bg-primary')+'">'+(isRaster?'Raster':'Vector')+'</span>'+
          '</div>'+
          '<div class="card-body d-flex flex-column">'+
            '<h3 class="card-title">'+esc(l.title)+'</h3>'+
            '<span class="resname mt-1 mb-2">'+esc(l.alternate||l.name)+'</span>'+
            '<p class="card-text mb-0">'+esc(l.raw_abstract && l.raw_abstract!=='No abstract provided'?l.raw_abstract:l.abstract||'Chưa có mô tả.')+'</p>'+
            '<div class="meta d-flex flex-wrap gap-3 mt-2">'+
              '<span><i class="fa fa-user me-1"></i>'+esc(owner)+'</span>'+
              '<span><i class="fa fa-calendar me-1"></i>'+esc((l.date||l.created||'').slice(0,10))+'</span>'+
              '<span><i class="fa fa-download me-1"></i>'+(l.popular_count||0)+'</span>'+
            '</div>'+
          '</div>'+
          '<div class="card-footer d-flex justify-content-between align-items-center">'+
            '<span class="text-secondary small">'+esc(l.srid||'EPSG:4326')+'</span>'+
            '<a class="btn btn-sm btn-open" href="'+detail+'">Mở layer <i class="fa fa-arrow-right ms-1"></i></a>'+
          '</div>'+
        '</div>'+
      '</div>';
    }).join('');
  }

  qEl.addEventListener('input', render);
  typeEl.addEventListener('change', render);
  sortEl.addEventListener('change', render);

  fetch('/api/v2/datasets/?page_size=100')
    .then(r=>r.json())
    .then(function(d){
      all = (d.datasets||[]).map(function(x){
        let type='vector';
        if(x.sourcetype==='coverage'||x.sourcetype==='remote'){ type='raster'; }
        return Object.assign({}, x, { type: type });
      });
      render();
    })
    .catch(function(){ grid.innerHTML='<div class="col-12 text-center py-5 text-secondary"><i class="fa fa-exclamation-triangle fa-3x d-block mb-2" style="opacity:.4"></i>Không thể tải dữ liệu. Vui lòng thử lại.</div>'; });
</script>
</body>
</html>
