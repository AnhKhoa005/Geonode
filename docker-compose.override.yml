# WebGIS custom UI - mount giao diện tùy chỉnh vào container GeoNode.
# Đặt file này cạnh docker-compose.yml của GeoNode rồi chạy: docker compose up -d
services:
  django:
    volumes:
      - ./templates/geonode-mapstore-client/index.html:/usr/src/venv/lib/python3.12/site-packages/geonode_mapstore_client/templates/index.html
      - ./templates/geonode-mapstore-client/pages/datasets.html:/usr/src/venv/lib/python3.12/site-packages/geonode_mapstore_client/templates/geonode-mapstore-client/pages/datasets.html
      - ./templates/geonode-mapstore-client/pages/maps.html:/usr/src/venv/lib/python3.12/site-packages/geonode_mapstore_client/templates/geonode-mapstore-client/pages/maps.html
      - ./templates/geonode-mapstore-client/pages/documents.html:/usr/src/venv/lib/python3.12/site-packages/geonode_mapstore_client/templates/geonode-mapstore-client/pages/documents.html
  celery:
    volumes:
      - ./templates/geonode-mapstore-client/index.html:/usr/src/venv/lib/python3.12/site-packages/geonode_mapstore_client/templates/index.html
      - ./templates/geonode-mapstore-client/pages/datasets.html:/usr/src/venv/lib/python3.12/site-packages/geonode_mapstore_client/templates/geonode-mapstore-client/pages/datasets.html
      - ./templates/geonode-mapstore-client/pages/maps.html:/usr/src/venv/lib/python3.12/site-packages/geonode_mapstore_client/templates/geonode-mapstore-client/pages/maps.html
      - ./templates/geonode-mapstore-client/pages/documents.html:/usr/src/venv/lib/python3.12/site-packages/geonode_mapstore_client/templates/geonode-mapstore-client/pages/documents.html
